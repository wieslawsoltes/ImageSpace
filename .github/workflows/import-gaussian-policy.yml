name: Import verified Gaussian execution-policy source
on:
  push:
    branches: [fix/gaussian-execution-policy]
    paths: [.github/workflows/import-gaussian-policy.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/gaussian-execution-policy
      - name: Verify baseline and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '6694055db22f64e67c8580df158772f48c7c4edb'
          python3 - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/gaussian-import/{i}.b64').read_text() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==111434
          assert hashlib.sha256(patch).hexdigest()=='56ba742f94a807bb51c5bff78914a681f03b3bea8d4bce511f4bee23352b678f'
          Path('/tmp/imagespace-gaussian-policy.patch').write_bytes(patch)
          PY
          git apply --check /tmp/imagespace-gaussian-policy.patch
          git apply --index /tmp/imagespace-gaussian-policy.patch
          git rm -r .github/gaussian-import
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct automatic Gaussian dispatch and cache resident GPU preparation'
          git push origin HEAD:fix/gaussian-execution-policy
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/ImageSpace-gaussian-policy-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-imported-gaussian-policy
          path: artifacts/ImageSpace-gaussian-policy-source.zip
