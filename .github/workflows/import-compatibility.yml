name: Import compatibility and performance source
on:
  push:
    branches: [feat/compatibility-performance]
    paths: [.github/workflows/import-compatibility.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/compatibility-performance
      - name: Verify and apply the validated source patch
        run: |
          git merge-base --is-ancestor 740768c65cc58007848ceb30d30dfe8c4e0627b3 HEAD
          git diff --exit-code 740768c65cc58007848ceb30d30dfe8c4e0627b3 -- src tests docs README.md CHANGELOG.md ImageSpace.slnx Directory.Build.props scripts packages
          python3 - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/compatibility/{i}.b64').read_text() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==198363
          assert hashlib.sha256(patch).hexdigest()=='60594e64d2e5aecdf2bf6ef06533afc82ba1084e246e2628b03691e4c144f1a1'
          Path('/tmp/imagespace-compatibility.patch').write_bytes(patch)
          PY
          git apply --check /tmp/imagespace-compatibility.patch
          git apply /tmp/imagespace-compatibility.patch
          rm -r .github/compatibility
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement PSD ZIP and mask interoperability, selection modifiers and measured raster fast paths'
          git push origin HEAD:feat/compatibility-performance
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/compatibility-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-applied-compatibility-source
          path: artifacts/compatibility-source.zip
