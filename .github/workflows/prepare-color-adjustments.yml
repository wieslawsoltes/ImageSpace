name: Prepare color adjustment metadata
on:
  push:
    branches: [feat/channel-mixer-exposure]
    paths: [.github/workflows/prepare-color-adjustments.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/channel-mixer-exposure
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Preserve existing documentation while adding color-adjustment guidance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def edit(path, function):
              file=Path(path); before=file.read_text(); after=function(before)
              if after!=before: file.write_text(after)
          def once(text, old, new):
              assert text.count(old)==1, old
              return text.replace(old,new,1)
          section='## New in 0.6\n\n**Editable Channel Mixer and Exposure.** Mix RGB channels or create monochrome corrections, and adjust linear-light exposure, offset and gamma with retained numeric/slider controls. Live gestures produce one undo state, source pixels remain unchanged, and cached Skia matrices/lookups work with masks, opacity and clipping. Native archive v6 preserves the new settings; PSD remains bounded compatibility interchange.\n\n[Color-adjustment algorithms, reusable APIs and validation](docs/channel-mixer-exposure.md).\n\n'
          edit('README.md', lambda s: once(s,'> **0.5.1-alpha.1','> **0.6.0-alpha.1').replace('## New in 0.5.1',section+'## GPU execution policy (0.5.1)',1).replace('and eight live Skia adjustment types','and ten live Skia adjustment types').replace('versions 1–5','versions 1–6').replace('versions 1-5','versions 1-6'))
          notes='## 0.6.0-alpha.1 — 2026-09-30\n\n- Added editable Channel Mixer and Exposure adjustment layers, immutable core settings, cached Skia matrices/lookups and native archive v6.\n- Added retained inspectors with original numeric/slider controls, RGB output selection, monochrome recipes, exposure presets and one-transaction live gestures.\n- Preserved source pixels, mask/opacity/clipping behavior, undo/redo and source-specific GPU execution policy.\n- Added render stamps, bounded renderer-owned caches, exact snapshot-token gesture ownership and version-downgrade rejection.\n- Added deterministic color-adjustment regressions and four real-input browser scenarios. Validation status is established by CI, not by this changelog.\n- This remains RGB8 working-space editing, not full Photoshop/HDR/ICC or editable Adobe PSD adjustment compatibility.\n\n'
          edit('CHANGELOG.md',lambda s: once(s,'# Changelog\n\n','# Changelog\n\n'+notes))
          edit('Directory.Build.props',lambda s: once(s,'<Version>0.5.1-alpha.1</Version>','<Version>0.6.0-alpha.1</Version>'))
          package=Path('packages/webgpu/package.json'); value=json.loads(package.read_text()); value['version']='0.6.0-alpha.1'; package.write_text(json.dumps(value,indent=2)+'\n')
          edit('ImageSpace.slnx',lambda s:once(s,'</Solution>','  <Folder Name="/ColorAdjustments/">\n    <Project Path="tests/ImageSpace.ColorAdjustmentTests/ImageSpace.ColorAdjustmentTests.csproj" />\n  </Folder>\n</Solution>'))
          for path in ['docs/features.md','docs/architecture.md','docs/development.md','docs/user-guide.md']:
              edit(path,lambda s:s+'\n## Channel Mixer and Exposure (0.6)\n\nEditable color mixing and linear-light exposure use retained inspectors and cached Skia filters. Native archive v6 preserves their settings; older archive versions remain readable. See [the workflow, algorithms, versioning and reusable APIs](channel-mixer-exposure.md). Full Photoshop, HDR, ICC and lossless PSD adjustment metadata are not implied.\n')
          PY
      - name: Format only changed CSharp source
        run: |
          mapfile -t files < <(git diff --name-only 66700cb3ef07a2baeed4add09f4f8e9ba6257394 HEAD -- '*.cs')
          if [ "${#files[@]}" -gt 0 ]; then dotnet format whitespace . --folder --include "${files[@]}" --verbosity minimal; fi
      - name: Commit metadata and source formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md CHANGELOG.md Directory.Build.props ImageSpace.slnx packages/webgpu/package.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Document and format ImageSpace 0.6 color adjustments'
            git push origin HEAD:feat/channel-mixer-exposure
          fi
