name: Import pending mask continuation
on:
  push:
    branches: [feat/adjustment-masks-compositor]
    paths: [.github/workflows/import-continuation.yml]
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/adjustment-masks-compositor
      - name: Verify and apply the reviewed continuation
        run: |
          git merge-base --is-ancestor 3f9ac1bafd07425b41f713103e78f401e0b27dd7 HEAD
          git diff --exit-code 3f9ac1bafd07425b41f713103e78f401e0b27dd7 -- src tests docs README.md ImageSpace.slnx .github/workflows/build.yml .github/workflows/release.yml
          python3 - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/continuation/{i}.b64').read_text() for i in range(4))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d3198a51a4925123dc8f695f7db4f356eb99723ecac37a6c61aa12e17c25d0be'
          Path('/tmp/imagespace-continuation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/imagespace-continuation.patch
          git apply /tmp/imagespace-continuation.patch
          rm -r .github/continuation
          rm .github/workflows/import-continuation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete mask editing, inspector, coverage tools and native archive v3 compatibility'
          git push origin HEAD:feat/adjustment-masks-compositor
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/mask-source.zip
      - name: Dispatch full validation of the applied source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/workflows/build.yml/dispatches -f ref=feat/adjustment-masks-compositor
          gh api -X POST repos/${{ github.repository }}/actions/workflows/desktop.yml/dispatches -f ref=feat/adjustment-masks-compositor
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-applied-mask-source
          path: artifacts/mask-source.zip
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Prepare isolated offline engine-validation tools
        run: |
          dotnet restore tests/ImageSpace.MaskEditingTests
          dotnet restore tests/ImageSpace.MaskTests
          dotnet restore tests/ImageSpace.Tests
          mkdir -p artifacts/offline
          python3 - <<'PY'
          import os,tarfile
          from pathlib import Path
          root=Path(os.environ['DOTNET_ROOT'])
          with tarfile.open('artifacts/offline/dotnet.tar.gz','w:gz',compresslevel=1) as tar:
              for name in ['dotnet','LICENSE.txt','ThirdPartyNotices.txt','sdk/10.0.401']:
                  path=root/name
                  if path.exists(): tar.add(path,arcname=name)
              for category in ['host/fxr','shared/Microsoft.NETCore.App','shared/Microsoft.AspNetCore.App','packs/Microsoft.NETCore.App.Ref','packs/Microsoft.AspNetCore.App.Ref','packs/Microsoft.NETCore.App.Host.linux-x64']:
                  for path in (root/category).glob('10.*'): tar.add(path,arcname=str(path.relative_to(root)))
          with tarfile.open('artifacts/offline/nuget.tar.gz','w:gz',compresslevel=1) as tar:
              tar.add(Path.home()/'.nuget/packages',arcname='packages')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-offline-engine-toolchain
          path: artifacts/offline
          compression-level: 0
          retention-days: 1
