name: Prepare Filter Gallery source
on:
  push:
    branches: [feat/resident-filter-gallery]
    paths: [.github/workflows/prepare-filter-gallery.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/resident-filter-gallery
          fetch-depth: 0
      - name: Require the requested branch revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Update release identity and documentation without replacing existing package guides
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          version='0.4.0-alpha.1'
          def change(path, transform):
              file=Path(path);original=file.read_text();updated=transform(original)
              if updated!=original: file.write_text(updated)
          def once(text,old,new):
              if text.count(old)!=1: raise RuntimeError(f'Expected one documentation anchor: {old}')
              return text.replace(old,new,1)
          change('Directory.Build.props',lambda s: once(s,'<Version>0.3.2-alpha.1</Version>',f'<Version>{version}</Version>'))
          package=Path('packages/webgpu/package.json');data=json.loads(package.read_text());data['version']=version
          package.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          section='''## New in 0.4

          **An ordered Filter Gallery backed by resident GPU sessions.** Preview, reorder, bypass and combine up to sixteen filters, compare with the original, then apply the complete recipe as one undoable edit. Cancel changes nothing; Repeat filter stack reuses the accepted settings. Preview images are sampled and coalesced without rebuilding the main retained selection UI.

          **Thirteen browser GPU kernels.** Premultiplied Gaussian blur, sharpen, emboss, edges and block-reduced pixelation join the eight color kernels. Interactive sessions upload their source once and reuse ping-pong buffers, bind groups and pipelines. Intermediate stages stay on the GPU; only requested final outputs are read back. Seeded Noise and unavailable adapters retain CPU fallback. Desktop gallery filtering currently uses CPU kernels while document rendering remains Skia-based.

          [Filter Gallery: workflow, reusable APIs, limits and validation](docs/filter-gallery.md).

          ## Retained selection UI'''
          def readme(s):
              s=once(s,'> **0.3.2-alpha.1','> **'+version)
              s=once(s,'## New in 0.3.2',section)
              s=once(s,'Fourteen CPU filters, eight optional WebGPU color kernels and eight live Skia adjustment types',
                  'Fourteen CPU filters, thirteen optional WebGPU color/spatial kernels, an ordered Filter Gallery and eight live Skia adjustment types')
              s=once(s,'An independently reusable browser WebGPU module accelerates invert, grayscale, sepia, brightness/contrast, saturation, gamma, threshold and posterize.',
                  'An independently reusable browser WebGPU module accelerates thirteen color/spatial filters, including Gaussian blur, convolution and block-reduced pixelation. Its resident-session API reuses immutable source and intermediate buffers across ordered previews.')
              s=s.replace('dotnet run --project tests/ImageSpace.LayerTests -c Release\n',
                  'dotnet run --project tests/ImageSpace.LayerTests -c Release\ndotnet run --project tests/ImageSpace.FilterStackTests -c Release\n')
              return s
          change('README.md',readme)
          notes='''## 0.4.0-alpha.1 — 2026-09-29

          - Added a real Uno Filter Gallery with ordered enable/reorder/remove controls, parameter editing, original/result comparison, sampled/coalesced previews, Apply/Cancel and Repeat filter stack.
          - Added immutable filter recipes and reusable CPU/resident session contracts with atomic selection-restricted commits, stale-result rejection, cancellation and independent copy-on-write ownership.
          - Expanded WebGPU support from eight to thirteen kernels with premultiplied separable blur, sharpen, emboss, edges and block-reduced Pixelate. Seeded Noise remains on CPU.
          - Resident sessions upload source once, cache buffers/bind groups, keep intermediate stages on GPU and expose explicit execution/readback/disposal and memory-budget diagnostics.
          - Fixed spatial-filter hidden RGB output so it no longer depends on sparse-tile allocation order. Exact bridge decoding retains these intermediates; transparent multi-stage CPU/GPU regressions cover the behavior.
          - Added C# transaction/ownership fixtures, independent WGSL and actual-C# parity checks, concurrent-session/device-loss tests, and real Uno gallery/pixel/undo/file/fallback acceptance.
          - Preserved existing retained UI optimizations and NuGet Trusted Publishing/release configuration. This is not full Photoshop parity, persisted Smart Filters, a GPU-only engine, or physical-GPU certification.

          '''
          change('CHANGELOG.md',lambda s: once(s,'# Changelog\n\n','# Changelog\n\n'+notes))
          gpu='''## WebGPU compute

          The standalone engine compiles four pipelines implementing thirteen RGBA8 filters: color/convolution, Gaussian horizontal, Gaussian vertical and block-reduced Pixelate. Seeded Noise retains the established CPU sequence. See [Filter Gallery](filter-gallery.md) for the complete backend and UI contracts.

          Resident sessions capture an immutable source, allocate two RGBA ping-pong buffers, an aligned parameter arena and readback storage, and allocate premultiplied float blur scratch only when needed. Bind groups and pipelines are reused. Each evaluation resets to the original source; intermediate filter stages never cross back to CPU. Explicit execute/read/apply methods separate computation from optional output readback. Reading adds a separate copy/map submission.

          Device error scopes and submissions are serialized across callers. Loss, disposal, validation failures and allocation limits invalidate sessions explicitly. Aggregate requested GPU buffers are capped at 256 MiB; per-buffer adapter limits can be stricter. This is not a process-wide memory bound and does not include JavaScript/managed image copies or native driver allocations. Spatial stages retain their computed hidden RGB deterministically for subsequent filters; color-only stages keep their established transparent-pixel normalization.

          The browser host uses these sessions for gallery previews and commits, retaining initial/final .NET-to-JavaScript RGBA transfers. A sampled 256-pixel preview is not a full-resolution proof of final output. CPU fallback is available for unsupported operations, adapters and memory limits; desktop gallery evaluation currently uses CPU kernels while the document compositor remains Skia-based. Device-loss and SwiftShader tests establish correctness, not physical-GPU speed or input-to-photon latency.

          '''
          def architecture(s):
              result,count=re.subn(r'(?ms)^## WebGPU compute\n.*?(?=^## |\Z)',lambda _:gpu,s)
              if count!=1: raise RuntimeError('WebGPU architecture section not found')
              return result
          change('docs/architecture.md',architecture)
          def features(s):
              s=s.replace('Eight kernels','Thirteen kernels').replace('eight kernels','thirteen kernels')
              s=s.replace('WebGPU color filters','WebGPU color/spatial filters')
              marker='## Explicitly not implemented'
              section='''## Filter Gallery and resident compute

          Filter Gallery supports ordered raster effects, bypass/reorder/remove, numeric parameters, sampled original/result comparison and one-transaction Apply/Cancel/Repeat. Browser sessions retain source and intermediate buffers and support thirteen GPU kernels, including blur/convolution/pixelation. Seeded Noise and unavailable adapters use CPU fallback; desktop gallery filtering is currently CPU-based. The recipe is not a persisted Smart Filter and does not preserve Photoshop filter metadata. See [the exact workflow and limits](filter-gallery.md).

          '''
              if marker in s: return s.replace(marker,section+marker,1)
              return s+'\n'+section
          change('docs/features.md',features)
          change('docs/development.md',lambda s:s.replace('imagespace-webgpu-0.3.2-alpha.1.tgz',f'imagespace-webgpu-{version}.tgz').replace(
              'dotnet run --project tests/ImageSpace.LayerTests -c Release\n',
              'dotnet run --project tests/ImageSpace.LayerTests -c Release\ndotnet run --project tests/ImageSpace.FilterStackTests -c Release\n'))
          PY
      - name: Format only CSharp files changed by this feature
        run: |
          mapfile -t files < <(git diff --name-only 08ae62138f0ae1288d7ad72d5133b62ff196d3f7 HEAD -- '*.cs')
          if [ "${#files[@]}" -gt 0 ]; then dotnet format whitespace . --folder --include "${files[@]}" --verbosity minimal; fi
      - name: Commit source formatting and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md CHANGELOG.md Directory.Build.props packages/webgpu/package.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Format Filter Gallery source and document 0.4 resident compute contracts'
            git push origin HEAD:feat/resident-filter-gallery
          fi
