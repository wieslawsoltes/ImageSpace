name: Prepare engine validation assets
on:
  push:
    branches: [feat/adjustment-masks-compositor]
    paths: [.github/workflows/engine-tools.yml]
permissions:
  contents: read
  actions: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ImageSpace-offline-engine-toolchain
          path: incoming
          run-id: 36384437438
          github-token: ${{ github.token }}
      - name: Retain only engine dependencies
        run: |
          python3 - <<'PY'
          import tarfile
          with tarfile.open('incoming/nuget.tar.gz') as source, tarfile.open('incoming/engine-packages.tar.gz','w:gz',compresslevel=1) as target:
              for entry in source:
                  parts=entry.name.split('/')
                  if len(parts)>1 and parts[1].lower().startswith('skiasharp'):
                      target.addfile(entry,source.extractfile(entry) if entry.isfile() else None)
          PY
          ls -lh incoming/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-offline-dotnet-sdk
          path: incoming/dotnet.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-offline-skia-packages
          path: incoming/engine-packages.tar.gz
          compression-level: 0
          retention-days: 1
