name: Desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Fetch licensed font assets
        shell: bash
        run: python3 scripts/fetch-assets.py
      - name: Publish native desktop host
        run: dotnet publish src/ImageSpace.App -c Release -f net10.0-desktop -r ${{ matrix.rid }} -p:ImageSpaceDesktopOnly=true --self-contained true -o artifacts/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-${{ matrix.rid }}
          path: artifacts/desktop
          include-hidden-files: true
