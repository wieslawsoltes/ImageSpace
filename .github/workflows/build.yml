name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Engine, formats and compositor tests
        run: |
          dotnet run --project tests/ImageSpace.Tests -c Release
          dotnet run --project tests/ImageSpace.RegressionTests -c Release
          dotnet run --project tests/ImageSpace.MaskTests -c Release
          dotnet run --project tests/ImageSpace.MaskEditingTests -c Release
          dotnet run --project tests/ImageSpace.CompatibilityTests -c Release
          dotnet run --project tests/ImageSpace.LayerTests -c Release
          dotnet run --project tests/ImageSpace.Benchmarks -c Release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ImageSpace-engine-validation
          path: |
            artifacts/*tests.json
            artifacts/*performance-results.json
      - name: Install browser workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Fetch open font assets
        run: python3 scripts/fetch-assets.py
      - name: Publish real Uno browser application
        run: dotnet publish src/ImageSpace.App -c Release -f net10.0-browserwasm -p:WasmShellWebAppBasePath=/ImageSpace/ -o artifacts/publish
      - name: Collect and validate static site
        run: python3 scripts/collect-site.py artifacts/publish site
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pointer, keyboard, tonal, mask, file and GPU browser acceptance
        run: |
          npm run test:browser
          mkdir -p site/screenshots
          cp artifacts/screenshots/*.png site/screenshots/
      - name: Pack all reusable NuGet and WebGPU libraries
        run: |
          mkdir -p artifacts/packages
          for project in src/ImageSpace.*/ImageSpace.*.csproj; do
            case "$project" in */ImageSpace.App/*) continue ;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
          npm run pack:webgpu
          test "$(find artifacts/packages -name '*.nupkg' | wc -l)" -eq 11
      - name: Prepare source archive
        run: git archive --format=zip HEAD -o artifacts/ImageSpace-source.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ImageSpace-browser-validation
          path: |
            artifacts/browser-results.json
            artifacts/webgpu-results.json
            artifacts/browser-tests
            artifacts/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('site/index.html') != ''
        with:
          name: ImageSpace-browser
          path: site
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-libraries
          path: artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-source
          path: artifacts/ImageSpace-source.zip
