name: Format source
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: source-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Format C# source
        run: dotnet format whitespace . --folder --verbosity minimal
      - name: Commit formatting and validate the resulting revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'Format C# source'
            git push origin HEAD:main
          fi
          gh api -X POST 'repos/${{ github.repository }}/actions/workflows/build.yml/dispatches' -f ref=main
          gh api -X POST 'repos/${{ github.repository }}/actions/workflows/desktop.yml/dispatches' -f ref=main
