name: Import reviewed UI responsiveness source
on:
  push:
    branches: [perf/retained-ui-selection]
    paths: [.github/workflows/import-ui.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: perf/retained-ui-selection
      - name: Verify and apply reviewed source patch
        run: |
          git merge-base --is-ancestor e4ac466d95ae42650bc364ac32a31fa747351c0d HEAD
          git diff --exit-code e4ac466d95ae42650bc364ac32a31fa747351c0d -- src tests docs README.md CHANGELOG.md Directory.Build.props packages
          python3 - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/ui-continuation/{i}.b64').read_text() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==148187
          assert hashlib.sha256(patch).hexdigest()=='8ad5b06b90788fbdebcde834673b221f0741bcb5c3eb1a3101918cf4150e1632'
          Path('/tmp/imagespace-ui.patch').write_bytes(patch)
          PY
          git apply --check /tmp/imagespace-ui.patch
          git apply /tmp/imagespace-ui.patch
          rm -r .github/ui-continuation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Optimize selection with retained UI, scoped notifications and independent overlays'
          git push origin HEAD:perf/retained-ui-selection
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/ui-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ImageSpace-applied-ui-source
          path: artifacts/ui-source.zip
